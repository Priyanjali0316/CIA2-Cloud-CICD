apiVersion: apps/v1
kind: Deployment
metadata:
  name: cia2-cicd-app
  labels:
    app: cia2-cicd-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: cia2-cicd-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: cia2-cicd-app

    spec:
      containers:
        - name: cia2-cicd-app
          image: priyuucicd2026.azurecr.io/cia2-cicd-app:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
